<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis últimas fotos - Gestor de Álbumes</title>
  <style nonce="{{NONCE}}">
    * { box-sizing: border-box; }
    body { margin: 0; background: #0080ff; font-family: Arial, sans-serif; color: #333; }
    main { width: 1000px; max-width: calc(100% - 32px); margin: 48px auto; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 2px 20px #0003; }
    h1 { margin: 0 0 16px; color: #0080ff; }
    main > p { color: #666; line-height: 1.5; }
    .fotos-recientes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin: 24px 0; }
    .foto-reciente { min-width: 0; background: #f2f2f2; border-radius: 12px; overflow: hidden; }
    .foto-reciente img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .foto-reciente h3 { margin: 14px 14px 8px; font-size: 16px; overflow-wrap: anywhere; }
    .foto-reciente p { margin: 0 14px 16px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    .aceptar { display: block; width: 220px; max-width: 100%; margin: 24px auto 0; padding: 16px; background: #0080ff; color: white; text-align: center; text-decoration: none; border-radius: 8px; }
    .aceptar:hover { background: #0066cc; }
    :focus-visible { outline: 2px solid #0080ff; outline-offset: 4px; }
    .aviso { background: #e0f0ff; padding: 14px; border-left: 4px solid #0080ff; }
    @media (max-width: 480px) { main { margin: 24px auto; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>Mis últimas fotos</h1>
    <p>Estas son tus cinco fotos más recientes. Pulsa Aceptar para ir a tus álbumes y agregar más fotos.</p>
    {{AVISO}}
    {{ULTIMAS_FOTOS}}
    <a class="aceptar" href="{{CONTEXTO}}/index">Aceptar</a>
  </main>
</body>
</html>
