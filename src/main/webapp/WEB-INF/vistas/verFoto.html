<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}} - {{ALBUM}}</title>
  <style nonce="{{NONCE}}">
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #18191a; color: #1c1e21; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 100vh; }
    .imagen { position: relative; display: flex; align-items: center; justify-content: center; padding: 64px 24px 24px; min-width: 0; }
    .imagen img { max-width: 100%; max-height: calc(100vh - 88px); object-fit: contain; }
    .volver { position: absolute; top: 16px; left: 16px; padding: 12px 16px; border-radius: 24px; background: #e4e6eb; color: #111; text-decoration: none; }
    aside { background: white; padding: 32px 24px; overflow-wrap: anywhere; }
    h1 { font-size: 22px; margin: 12px 0; }
    .autor { color: #65676b; line-height: 1.6; }
    button { display: block; width: 100%; border: 0; border-radius: 8px; padding: 14px; margin: 12px 0; background: #e4e6eb; color: #1c1e21; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #d8dadf; }
    .eliminar { color: #b42318; }
    :focus-visible { outline: 3px solid #0866ff; outline-offset: 3px; }
    .aviso { padding: 14px; background: #e7f3ff; line-height: 1.5; }
    dt { font-weight: bold; margin-top: 16px; } dd { margin: 5px 0; line-height: 1.5; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } .imagen { min-height: 50vh; } .imagen img { max-height: 65vh; } aside { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <section class="imagen" aria-label="Imagen ampliada">
      <a class="volver" href="{{CONTEXTO}}/agregar-fotos?id={{ALBUM_ID}}">✕ Volver al álbum</a>
      <img src="{{CONTEXTO}}/imagen?id={{FOTO_ID}}" alt="{{TITULO}}">
    </section>
    <aside>
      <h1>{{ALBUM}}</h1>
      <p class="autor">{{AUTOR}}</p>
      {{AVISO}}
      <form id="cambiar" method="post" action="{{CONTEXTO}}/ver-foto" enctype="multipart/form-data">
        <input type="hidden" name="accion" value="cambiarImagen">
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <input type="hidden" name="fotoId" value="{{FOTO_ID}}">
        <input id="nueva-imagen" type="file" name="imagen" accept=".jpg,.jpeg,.png,.gif,.webp" required hidden>
        <button id="seleccionar" type="button">Cambiar imagen</button>
      </form>
      <form id="eliminar" method="post" action="{{CONTEXTO}}/ver-foto">
        <input type="hidden" name="accion" value="eliminarImagen">
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <input type="hidden" name="fotoId" value="{{FOTO_ID}}">
        <button class="eliminar" type="submit">Eliminar imagen</button>
      </form>
      <button id="detalle" type="button" aria-expanded="false" aria-controls="datos">Detalle</button>
      <dl id="datos" hidden>
        <dt>Título</dt><dd>{{TITULO}}</dd>
        <dt>Álbum</dt><dd>{{ALBUM}}</dd>
        <dt>Usuario</dt><dd>{{AUTOR}}</dd>
        <dt>Fecha de carga</dt><dd>{{FECHA}}</dd>
        <dt>País del usuario</dt><dd>{{PAIS}}</dd>
      </dl>
      <p id="estado" role="status"></p>
    </aside>
  </main>
  <script nonce="{{NONCE}}">
    const selector = document.getElementById('nueva-imagen');
    document.getElementById('seleccionar').addEventListener('click', () => selector.click());
    selector.addEventListener('change', () => {
      if (!selector.files.length) return;
      if (selector.files[0].size > 32 * 1024 * 1024) {
        document.getElementById('estado').textContent = 'No se pueden cargar las fotos, máximo 32MB';
        selector.value = '';
        return;
      }
      document.getElementById('seleccionar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando imagen…';
      document.getElementById('cambiar').requestSubmit();
    });
    document.getElementById('eliminar').addEventListener('submit', event => {
      if (!confirm('¿Eliminar esta imagen definitivamente del álbum?')) event.preventDefault();
    });
    document.getElementById('detalle').addEventListener('click', event => {
      const datos = document.getElementById('datos');
      datos.hidden = !datos.hidden;
      event.currentTarget.setAttribute('aria-expanded', String(!datos.hidden));
    });
  </script>
</body>
</html>
